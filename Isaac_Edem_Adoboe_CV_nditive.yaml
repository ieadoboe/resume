    projects:
      - name: 'Surrogate-Based Optimization for Molecular Configurations'
        date: Spring 2025
        start_date: 2025-01
        end_date: 2025-08
        location: 
        summary: Developed machine learning surrogates to accelerate quantum chemistry calculations for protein-carbohydrate binding predictions.
        highlights:
          - "Implemented 4 ML models (Random Forest, XGBoost, MLP, SVR) on 740-sample dataset (16D feature space). Performed 80/20 cross-validation with RandomSearch for hyperparameter tuning; XGBoost achieved best prediction performance."
          - "Deployed trained surrogates for global optimization using L-BFGS-B and Differential Evolution across 24 molecular pairs, reducing computational cost by 1000× compared to direct quantum chemistry calculations."
      - name: 'Fine-Tuned CodeGen Model for Code Completion'
        date: Summer 2025
        start_date: 2021-01
        end_date: 2024-01
        location: 
        summary: Fine-tuned transformer-based CodeGen-350M on CodeSearchNet Python corpus using HuggingFace Transformers.
        highlights:
          - "Trained on 2,700 samples (300 validation) with GPU acceleration. Implemented learning rate scheduling, warmup steps, and mixed-precision training for efficient convergence. Evaluated using BLEU and CodeBLEU metrics"
      - name: 'Machine Learning-Based Fault Detection in Induction Motors'
        date: 'Jan - Aug 2021'
        start_date: 2021-01
        end_date: 2021-08
        location:
        summary: Undergraduate thesis developing CNN architecture achieving 61.4% multi-class accuracy on motor fault classification. Processed motor current signals into time-frequency spectrograms with TensorFlow/Keras implementation.
        highlights:
          - "Built custom CNN (4 Conv2D layers, 64 filters, ReLU activation, MaxPooling 2×2, input shape 224×224×3) achieving 61.4% multi-class accuracy across 5 fault conditions (healthy, bearing, winding, single-phasing, motor-washer faults) using TensorFlow/Keras."
          - "Converted raw motor current and vibration time-series into 2D scalograms via Continuous Wavelet Transform (CWT) in MATLAB. Extracted time-frequency representations from 1,500 sensor data points collected across 30 experimental runs of 10 seconds each."
          - "Implemented rotation-based augmentation (90°, 180°, 270°) to address limited dataset problem. Preprocessed with ImageDataGenerator (rescaling, shear, zoom). Split data 90% training / 10% validation."

