design:
  theme: sb2nov
  page:
    size: a4
    # size: us-letter
    top_margin: 1.5cm
    bottom_margin: 1.5cm
    left_margin: 1.5cm
    right_margin: 1.5cm
    show_page_numbering: true
    show_last_updated_date: false
  colors:
    text: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
    last_updated_date_and_page_numbering: rgb(128, 128, 128)
  text:
    font_family: Calibri
    font_size: 9pt
    leading: 0.6em
    alignment: left
    date_and_location_column_alignment: right
  links:
    underline: true
    use_external_link_icon: true
  header:
    name_font_family: Calibri
    name_font_size: 14pt
    name_bold: true
    small_caps_for_name: false
    photo_width: 3.5cm
    vertical_space_between_name_and_connections: 0.4cm
    vertical_space_between_connections_and_first_section: 0.4cm
    horizontal_space_between_connections: 0.5cm
    connections_font_family: Calibri
    separator_between_connections: ''
    use_icons_for_connections: true
    use_urls_as_placeholders_for_connections: false
    make_connections_links: true
    alignment: center
  section_titles:
    type: with-full-line
    font_family: Calibri
    font_size: 1.4em
    bold: false
    small_caps: true
    line_thickness: 0.5pt
    vertical_space_above: 0.3cm
    vertical_space_below: 0.3cm
  entries:
    date_and_location_width: 4.15cm
    left_and_right_margin: 0.2cm
    horizontal_space_between_columns: 0.1cm
    vertical_space_between_entries: 1.2em
    allow_page_break_in_sections: true
    allow_page_break_in_entries: true
    short_second_row: false
    show_time_spans_in: []
  highlights:
    bullet: ◦
    nested_bullet: '-'
    top_margin: 0.25cm
    left_margin: 0.15cm
    vertical_space_between_highlights: 0.25cm
    horizontal_space_between_bullet_and_highlight: 0.5em
    summary_left_margin: 0cm
